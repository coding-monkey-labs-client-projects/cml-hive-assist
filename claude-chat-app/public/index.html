<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #16213e;
      padding: 16px 24px;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #e94560;
    }

    header .badge {
      font-size: 0.7rem;
      background: #0f3460;
      color: #a0c4ff;
      padding: 3px 8px;
      border-radius: 10px;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 0.95rem;
    }

    .message.user {
      align-self: flex-end;
      background: #0f3460;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: #16213e;
      border: 1px solid #0f3460;
      border-bottom-left-radius: 4px;
    }

    .message.assistant .cursor {
      display: inline-block;
      width: 8px;
      height: 16px;
      background: #e94560;
      animation: blink 0.8s infinite;
      vertical-align: text-bottom;
      margin-left: 2px;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .message.error {
      align-self: center;
      background: #3d1424;
      border: 1px solid #e94560;
      color: #ff8a8a;
      font-size: 0.85rem;
    }

    #input-area {
      padding: 16px 24px;
      background: #16213e;
      border-top: 1px solid #0f3460;
      display: flex;
      gap: 12px;
    }

    #message-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #0f3460;
      border-radius: 8px;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      outline: none;
      min-height: 48px;
      max-height: 150px;
    }

    #message-input:focus {
      border-color: #e94560;
    }

    #send-btn {
      padding: 12px 24px;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    #send-btn:hover { background: #c73852; }
    #send-btn:disabled { background: #555; cursor: not-allowed; }

    .welcome {
      text-align: center;
      color: #666;
      margin-top: 20vh;
    }

    .welcome h2 { color: #e94560; margin-bottom: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>Claude Chat</h1>
    <span class="badge">Powered by Claude Code CLI</span>
  </header>

  <div id="chat-container">
    <div class="welcome">
      <h2>Welcome to Claude Chat</h2>
      <p>Type a message to start chatting. Your conversation is backed by the Claude Code CLI.</p>
    </div>
  </div>

  <div id="input-area">
    <textarea id="message-input" placeholder="Type your message..." rows="1"></textarea>
    <button id="send-btn">Send</button>
  </div>

  <script>
    const chatContainer = document.getElementById("chat-container");
    const messageInput = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-btn");

    let sessionId = null;
    let isStreaming = false;

    // Auto-resize textarea
    messageInput.addEventListener("input", () => {
      messageInput.style.height = "auto";
      messageInput.style.height = Math.min(messageInput.scrollHeight, 150) + "px";
    });

    // Send on Enter (Shift+Enter for newline)
    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener("click", sendMessage);

    function addMessage(role, text) {
      // Remove welcome screen on first message
      const welcome = chatContainer.querySelector(".welcome");
      if (welcome) welcome.remove();

      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.textContent = text;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || isStreaming) return;

      isStreaming = true;
      sendBtn.disabled = true;
      messageInput.value = "";
      messageInput.style.height = "auto";

      addMessage("user", text);

      // Create assistant message placeholder with blinking cursor
      const assistantDiv = addMessage("assistant", "");
      const cursor = document.createElement("span");
      cursor.className = "cursor";
      assistantDiv.appendChild(cursor);

      let fullResponse = "";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, sessionId }),
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop() || "";

          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const jsonStr = line.slice(6);

            try {
              const event = JSON.parse(jsonStr);

              if (event.type === "text") {
                fullResponse += event.text;
                assistantDiv.textContent = fullResponse;
                assistantDiv.appendChild(cursor);
                chatContainer.scrollTop = chatContainer.scrollHeight;
              } else if (event.type === "error") {
                addMessage("error", event.text);
              } else if (event.type === "done") {
                sessionId = event.sessionId;
              }
            } catch {
              // ignore parse errors
            }
          }
        }
      } catch (err) {
        addMessage("error", `Network error: ${err.message}`);
      }

      // Remove cursor, finalize
      const cursorEl = assistantDiv.querySelector(".cursor");
      if (cursorEl) cursorEl.remove();

      if (!fullResponse) {
        assistantDiv.textContent = "(No response received)";
      }

      isStreaming = false;
      sendBtn.disabled = false;
      messageInput.focus();
    }
  </script>
</body>
</html>
